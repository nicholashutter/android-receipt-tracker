plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.receipttracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.receipttracker"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.1.1"

        // ML Kit standalone text recognition ships the model as an "installable
        // component archive" so the model is available offline from first launch.
        manifestPlaceholders = [
                mlkit_vision_dependency: "ica"
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign the release APK with the debug key so it's installable
            // for ad-hoc distribution. Swap in a real release signingConfig
            // before Play Store publishing (see docs/asset-pipeline.md).
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Unit tests: pure JVM. Stubbed Android types return default values
    // (0 / false / null) so the room annotations and android.graphics.Rect
    // references in our POJOs don't blow up at test time. Anything that
    // truly needs a real Android Context (Activities, Room SQL, ML Kit)
    // belongs in androidTest, not here.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all { testTask ->
                testTask.useJUnitPlatform()
                // Pin the test JVM to UTC so date-formatting tests are
                // deterministic across machines. Without this, epoch 0
                // renders as "Dec 31, 1969" in any US timezone.
                testTask.jvmArgs '-Duser.timezone=UTC'
            }
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    // LiveData for the AsyncTask replacement in the list activities
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    // Material
    implementation 'com.google.android.material:material:1.11.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    // CameraX returns Guava-style ListenableFuture; the empty-marker artifact supplies the
    // interface and concurrent-futures supplies the implementation.
    implementation 'com.google.guava:listenablefuture:1.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // ML Kit on-device text recognition (Latin script)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Tesseract for handwritten text recognition. ML Kit's Latin model is
    // print-optimised and misses most pen-written digits/words; tesseract4android
    // is the on-device fallback for visually-emphasised bboxes (user wrote a
    // tip, circled the total in pen, etc.). The `eng.traineddata` file is NOT
    // bundled in this repo (~22MB, large for git) — drop it into
    // app/src/main/assets/tessdata/eng.traineddata and the OCR will pick it up.
    // See scripts/fetch_tesseract_eng.sh for a one-line fetch.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.7.0'

    // Room (local DB)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // SAF DocumentFile (export to user-picked folder)
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // ---------- Unit tests (pure JVM, run via :app:testDebugUnitTest) ----------
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    // Real org.json on the test classpath. The Android jar ships only
    // stubs of org.json.JSONObject/Array, so without this dependency
    // anything that calls json.put(...) would throw at test time.
    testImplementation 'org.json:json:20231013'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
}
