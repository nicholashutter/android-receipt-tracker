plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.receipttracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.receipttracker"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        // ML Kit standalone text recognition ships the model as an "installable
        // component archive" so the model is available offline from first launch.
        manifestPlaceholders = [
                mlkit_vision_dependency: "ica"
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    // LiveData for the AsyncTask replacement in the list activities
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    // Material
    implementation 'com.google.android.material:material:1.11.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    // CameraX returns Guava-style ListenableFuture; the empty-marker artifact supplies the
    // interface and concurrent-futures supplies the implementation.
    implementation 'com.google.guava:listenablefuture:1.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // ML Kit on-device text recognition (Latin script)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Room (local DB)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // SAF DocumentFile (export to user-picked folder)
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
